<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- One-color version using #a5b4fc (ui-accent) -->
  
  <!-- Coin being dug up -->
  <circle cx="44" cy="18" r="14" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  <circle cx="44" cy="18" r="10" fill="none" stroke="#a5b4fc" stroke-width="1"/>
  <text x="44" y="22" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">$</text>
  
  <!-- Mole body outline -->
  <ellipse cx="28" cy="42" rx="22" ry="18" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  
  <!-- Arm reaching for coin -->
  <ellipse cx="42" cy="30" rx="8" ry="5" fill="none" stroke="#a5b4fc" stroke-width="1.5" transform="rotate(-30 42 30)"/>
  <circle cx="48" cy="26" r="4" fill="none" stroke="#a5b4fc" stroke-width="1.5"/>
  
  <!-- Face -->
  <ellipse cx="18" cy="38" rx="14" ry="12" fill="none" stroke="#a5b4fc" stroke-width="1.5"/>
  
  <!-- Snout -->
  <ellipse cx="8" cy="40" rx="7" ry="5" fill="none" stroke="#a5b4fc" stroke-width="1.5"/>
  
  <!-- Nose -->
  <ellipse cx="4" cy="40" rx="3.5" ry="2.8" fill="#a5b4fc"/>
  
  <!-- Eye -->
  <circle cx="14" cy="35" r="2" fill="#a5b4fc"/>
  
  <!-- Whiskers -->
  <line x1="8" y1="38" x2="1" y2="35" stroke="#a5b4fc" stroke-width="1"/>
  <line x1="8" y1="40" x2="1" y2="40" stroke="#a5b4fc" stroke-width="1"/>
  <line x1="8" y1="42" x2="1" y2="45" stroke="#a5b4fc" stroke-width="1"/>
  
  <!-- Claws -->
  <line x1="50" y1="24" x2="53" y2="21" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="51" y1="26" x2="55" y2="24" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="51" y1="28" x2="55" y2="28" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
