<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  
  <!-- Scale and center the mole design -->
  <g transform="translate(96, 64) scale(5)">
    <!-- Mole body (egg shape) -->
    <ellipse cx="32" cy="24" rx="18" ry="20" fill="#2d3548"/>
    
    <!-- Ears -->
    <ellipse cx="20" cy="8" rx="4" ry="5" fill="#2d3548"/>
    <ellipse cx="44" cy="8" rx="4" ry="5" fill="#2d3548"/>
    
    <!-- Large coin (covering lower body) -->
    <ellipse cx="32" cy="44" rx="22" ry="18" fill="url(#coinGrad)"/>
    
    <!-- Three white lines on coin -->
    <line x1="18" y1="40" x2="46" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="46" x2="46" y2="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="52" x2="46" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Paws gripping top of coin -->
    <ellipse cx="16" cy="32" rx="5" ry="4" fill="#2d3548"/>
    <ellipse cx="48" cy="32" rx="5" ry="4" fill="#2d3548"/>
    <!-- Claws (white) -->
    <circle cx="12" cy="34" r="1.5" fill="#ffffff"/>
    <circle cx="14" cy="36" r="1.5" fill="#ffffff"/>
    <circle cx="16" cy="37" r="1.5" fill="#ffffff"/>
    <circle cx="52" cy="34" r="1.5" fill="#ffffff"/>
    <circle cx="50" cy="36" r="1.5" fill="#ffffff"/>
    <circle cx="48" cy="37" r="1.5" fill="#ffffff"/>
    
    <!-- Eyes (white ovals with dark pupils) -->
    <ellipse cx="26" cy="20" rx="4" ry="5" fill="#ffffff"/>
    <ellipse cx="38" cy="20" rx="4" ry="5" fill="#ffffff"/>
    <circle cx="27" cy="21" r="2" fill="#0d1117"/>
    <circle cx="39" cy="21" r="2" fill="#0d1117"/>
    
    <!-- Nose (pink) -->
    <ellipse cx="32" cy="28" rx="3" ry="2" fill="#fda4af"/>
    
    <!-- Whiskers -->
    <line x1="24" y1="26" x2="14" y2="24" stroke="#a5b4fc" stroke-width="0.8" opacity="0.6"/>
    <line x1="24" y1="28" x2="14" y2="28" stroke="#a5b4fc" stroke-width="0.8" opacity="0.6"/>
    <line x1="24" y1="30" x2="14" y2="32" stroke="#a5b4fc" stroke-width="0.8" opacity="0.6"/>
    <line x1="40" y1="26" x2="50" y2="24" stroke="#a5b4fc" stroke-width="0.8" opacity="0.6"/>
    <line x1="40" y1="28" x2="50" y2="28" stroke="#a5b4fc" stroke-width="0.8" opacity="0.6"/>
    <line x1="40" y1="30" x2="50" y2="32" stroke="#a5b4fc" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
