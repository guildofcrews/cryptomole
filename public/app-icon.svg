<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  
  <!-- Scale and center the mole design -->
  <g transform="translate(64, 64) scale(6)">
    <!-- Coin being held -->
    <circle cx="46" cy="20" r="16" fill="url(#coinGrad)"/>
    <!-- Three white horizontal lines on coin -->
    <line x1="38" y1="15" x2="54" y2="15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="20" x2="54" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="25" x2="54" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mole body -->
    <ellipse cx="24" cy="44" rx="20" ry="16" fill="#2d3548"/>
    
    <!-- Mole arm reaching to hold coin -->
    <ellipse cx="38" cy="32" rx="8" ry="5" fill="#2d3548" transform="rotate(-25 38 32)"/>
    <circle cx="44" cy="28" r="5" fill="#2d3548"/>
    
    <!-- Mole face -->
    <ellipse cx="14" cy="40" rx="12" ry="10" fill="#3d4558"/>
    
    <!-- Snout -->
    <ellipse cx="6" cy="42" rx="6" ry="4.5" fill="#4a5568"/>
    
    <!-- Nose (pink) -->
    <ellipse cx="2" cy="42" rx="3" ry="2.5" fill="#fda4af"/>
    
    <!-- Eye -->
    <circle cx="12" cy="37" r="1.8" fill="#0d1117"/>
    <circle cx="11.6" cy="36.6" r="0.5" fill="#a5b4fc" opacity="0.7"/>
    
    <!-- Whiskers -->
    <line x1="6" y1="39" x2="0" y2="36" stroke="#a5b4fc" stroke-width="0.7" opacity="0.5"/>
    <line x1="6" y1="41" x2="0" y2="41" stroke="#a5b4fc" stroke-width="0.7" opacity="0.5"/>
    <line x1="6" y1="43" x2="0" y2="46" stroke="#a5b4fc" stroke-width="0.7" opacity="0.5"/>
    
    <!-- Paw details -->
    <circle cx="46" cy="30" r="1" fill="#a5b4fc" opacity="0.4"/>
    <circle cx="48" cy="28" r="1" fill="#a5b4fc" opacity="0.4"/>
    <circle cx="46" cy="26" r="1" fill="#a5b4fc" opacity="0.4"/>
  </g>
</svg>
